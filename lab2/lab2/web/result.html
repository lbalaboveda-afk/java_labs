<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор — результат</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Результат вычисления</h1>

    <table class="result-table">
        <thead>
        <tr>
            <th>Первый аргумент</th>
            <th>Второй аргумент</th>
            <th>Операция</th>
            <th>Результат</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td id="argA">—</td>
            <td id="argB">—</td>
            <td id="opLabel">—</td>
            <td id="resultValue">—</td>
        </tr>
        </tbody>
    </table>

    <figure class="photo">
        <img src="photo.jpg" alt="Моя любимая фотография">
        <figcaption>Моя любимая фотография</figcaption>
    </figure>

    <p class="back-link">
        <a href="index.html">← Вернуться к вводу данных</a>
    </p>
</div>

<script src="script.js"></script>

</html>
